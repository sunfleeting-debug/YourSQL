[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yoursql"
version = "0.1.0"
description = "A persistent educational mini database management system"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
yoursql = "yoursql.cli:main"
yoursql-web = "yoursql.web:main"

[tool.setuptools.package-data]
yoursql = ["workbench_static/*", "workbench_static/assets/*"]

[tool.setuptools.packages.find]
include = ["yoursql*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
